<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Snake</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #121829;
    --grid: #1a2238;
    --neon: #39ff14;
    --neon2: #00e5ff;
    --food: #ff2e88;
    --text: #e6ecff;
    --muted: #7f8cb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #141b33 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    display: flex;
    gap: 2rem;
    align-items: baseline;
    margin-bottom: 0.75rem;
    width: min(92vw, 520px);
    justify-content: space-between;
  }
  h1 {
    font-size: 1.4rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--neon);
    text-shadow: 0 0 10px var(--neon), 0 0 30px rgba(57,255,20,0.5);
  }
  .stats { display: flex; gap: 1.25rem; font-variant-numeric: tabular-nums; }
  .stat { text-align: right; }
  .stat .label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
  .stat .value { font-size: 1.3rem; font-weight: 600; color: var(--neon2); text-shadow: 0 0 8px rgba(0,229,255,0.6); }
  .frame {
    position: relative;
    width: min(92vw, 520px);
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 0 0 2px #22304f, 0 0 40px rgba(0,229,255,0.15), inset 0 0 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: rgba(11,15,26,0.82);
    backdrop-filter: blur(3px);
    text-align: center;
    padding: 1rem;
    transition: opacity 0.2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 2rem; color: var(--neon); text-shadow: 0 0 14px var(--neon); letter-spacing: 0.1em; }
  .overlay p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
  .overlay .big { color: var(--text); font-size: 1.1rem; }
  button {
    margin-top: 0.5rem;
    background: transparent;
    color: var(--neon2);
    border: 2px solid var(--neon2);
    border-radius: 999px;
    padding: 0.6rem 1.6rem;
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0,229,255,0.4);
    transition: background 0.15s, color 0.15s;
  }
  button:hover, button:focus { background: var(--neon2); color: var(--bg); outline: none; }
  .dpad {
    display: none;
    margin-top: 1rem;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
  }
  .dpad button {
    margin: 0; padding: 0; border-radius: 12px; font-size: 1.4rem;
    box-shadow: none; border-color: #2a3a5f; color: var(--text);
  }
  .dpad button:active { background: var(--neon2); color: var(--bg); }
  .dpad .u { grid-column: 2; grid-row: 1; }
  .dpad .l { grid-column: 1; grid-row: 2; }
  .dpad .r { grid-column: 3; grid-row: 2; }
  .dpad .d { grid-column: 2; grid-row: 3; }
  @media (pointer: coarse) { .dpad { display: grid; } }
  footer { margin-top: 0.75rem; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.05em; }
  kbd { background: #1c2742; border-radius: 4px; padding: 0 0.35em; color: var(--text); font-family: inherit; }
</style>
</head>
<body>
  <header>
    <h1>Neon Snake</h1>
    <div class="stats">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    </div>
  </header>

  <div class="frame">
    <canvas id="game" width="520" height="520"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Neon Snake</h2>
      <p class="big" id="ovMsg">Eat the glowing food. Don't hit the walls or yourself.</p>
      <p>Move with <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>, swipe on touch.<br><kbd>Space</kbd> / <kbd>P</kbd> to pause.</p>
      <button id="startBtn">Start</button>
    </div>
  </div>

  <div class="dpad">
    <button class="u" data-dir="up" aria-label="Up">▲</button>
    <button class="l" data-dir="left" aria-label="Left">◀</button>
    <button class="r" data-dir="right" aria-label="Right">▶</button>
    <button class="d" data-dir="down" aria-label="Down">▼</button>
  </div>

  <footer>Every 5 foods = next level = faster snake</footer>

<script>
(() => {
  const GRID = 20;                 // cells per side
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');

  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 },
  };
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right',
  };

  let snake, dir, nextDirs, food, score, best, level, foodsEaten;
  let state = 'idle';            // idle | running | paused | dead
  let lastTick = 0, acc = 0;
  let particles = [];
  let pulse = 0;

  best = Number(localStorage.getItem('neon-snake-best') || 0);
  bestEl.textContent = best;

  function tickInterval() {
    // ms per step; speeds up with level, floors at 60ms
    return Math.max(60, 160 - (level - 1) * 12);
  }

  function reset() {
    const c = Math.floor(GRID / 2);
    snake = [{ x: c, y: c }, { x: c - 1, y: c }, { x: c - 2, y: c }];
    dir = DIRS.right;
    nextDirs = [];
    score = 0; level = 1; foodsEaten = 0;
    particles = [];
    placeFood();
    updateHud();
  }

  function placeFood() {
    const free = [];
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!occupied.has(x + ',' + y)) free.push({ x, y });
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    bestEl.textContent = best;
  }

  function queueDir(name) {
    const d = DIRS[name];
    if (!d) return;
    const ref = nextDirs.length ? nextDirs[nextDirs.length - 1] : dir;
    // ignore reversals and duplicates
    if (ref.x === -d.x && ref.y === -d.y) return;
    if (ref.x === d.x && ref.y === d.y) return;
    if (nextDirs.length < 2) nextDirs.push(d);
  }

  function step() {
    if (nextDirs.length) dir = nextDirs.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return die();
    // self collision (tail will move unless we eat, so ignore last segment)
    const ate = food && head.x === food.x && head.y === food.y;
    const bodyToCheck = ate ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);
    if (ate) {
      score += 10 * level;
      foodsEaten++;
      spawnParticles(food.x, food.y);
      if (foodsEaten % 5 === 0) level++;
      if (score > best) { best = score; localStorage.setItem('neon-snake-best', best); }
      placeFood();
      updateHud();
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function die() {
    state = 'dead';
    ovTitle.textContent = 'Game Over';
    ovMsg.textContent = `Score ${score} · Level ${level}` + (score >= best && score > 0 ? ' · New best!' : '');
    startBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function win() {
    state = 'dead';
    ovTitle.textContent = 'You filled the grid!';
    ovMsg.textContent = `Perfect run · Score ${score}`;
    startBtn.textContent = 'Play again';
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    state = 'running';
    acc = 0; lastTick = performance.now();
    overlay.classList.add('hidden');
    canvas.focus();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      ovTitle.textContent = 'Paused';
      ovMsg.textContent = 'Press Space or P to resume';
      startBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'running';
      lastTick = performance.now();
      overlay.classList.add('hidden');
    }
  }

  function spawnParticles(cx, cy) {
    const cell = canvas.width / GRID;
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x: (cx + 0.5) * cell, y: (cy + 0.5) * cell,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1,
      });
    }
  }

  // ---------- rendering ----------
  function draw(dt) {
    const W = canvas.width, cell = W / GRID;
    pulse += dt * 0.005;

    ctx.fillStyle = '#0e1424';
    ctx.fillRect(0, 0, W, W);

    // grid
    ctx.strokeStyle = '#1a2238';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < GRID; i++) {
      ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, W);
      ctx.moveTo(0, i * cell + 0.5); ctx.lineTo(W, i * cell + 0.5);
    }
    ctx.stroke();

    // food
    if (food) {
      const fx = (food.x + 0.5) * cell, fy = (food.y + 0.5) * cell;
      const r = cell * (0.3 + 0.05 * Math.sin(pulse * 3));
      ctx.shadowColor = '#ff2e88';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff2e88';
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(1, snake.length - 1);
      const isHead = i === 0;
      ctx.shadowColor = isHead ? '#39ff14' : '#00e5ff';
      ctx.shadowBlur = isHead ? 20 : 10;
      ctx.fillStyle = isHead ? '#39ff14' : lerpColor([0, 229, 255], [20, 90, 140], t);
      const pad = cell * 0.08;
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.25);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // eyes on head
    const h = snake[0];
    const ex = (h.x + 0.5) * cell, ey = (h.y + 0.5) * cell;
    ctx.fillStyle = '#0b0f1a';
    const off = cell * 0.18, side = cell * 0.17;
    const px = dir.y !== 0 ? side : 0, py = dir.x !== 0 ? side : 0;
    ctx.beginPath();
    ctx.arc(ex + dir.x * off + px, ey + dir.y * off + py, cell * 0.08, 0, Math.PI * 2);
    ctx.arc(ex + dir.x * off - px, ey + dir.y * off - py, cell * 0.08, 0, Math.PI * 2);
    ctx.fill();

    // particles
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96;
      p.life -= dt / 600;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = '#ff2e88';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function lerpColor(a, b, t) {
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  // ---------- main loop ----------
  function loop(now) {
    const dt = Math.min(100, now - lastTick);
    lastTick = now;
    if (state === 'running') {
      acc += dt;
      const interval = tickInterval();
      while (acc >= interval && state === 'running') {
        acc -= interval;
        step();
      }
    }
    draw(dt);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      if (state === 'idle' || state === 'dead') start();
      else togglePause();
      return;
    }
    const name = KEYMAP[e.key];
    if (name) {
      e.preventDefault();
      if (state === 'idle' || state === 'dead') { start(); }
      if (state === 'running') queueDir(name);
    }
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  document.querySelectorAll('.dpad button').forEach(btn => {
    const handler = e => {
      e.preventDefault();
      if (state === 'idle' || state === 'dead') start();
      queueDir(btn.dataset.dir);
    };
    btn.addEventListener('pointerdown', handler);
  });

  // swipe
  let touchStart = null;
  canvas.addEventListener('pointerdown', e => { touchStart = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', e => {
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    touchStart = null;
    if (Math.hypot(dx, dy) < 24) { if (state === 'running' || state === 'paused') togglePause(); return; }
    const name = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (state === 'idle' || state === 'dead') start();
    queueDir(name);
  });

  reset();
  requestAnimationFrame(t => { lastTick = t; loop(t); });
})();
</script>
</body>
</html>
